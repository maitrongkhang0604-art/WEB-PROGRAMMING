<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#23644b">

    <title>Gọn — A lighter day</title>

    <style>
        /* CSS giữ nguyên ở đây */
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside>
        <div>
            <div class="logo">
                gọn<span>˙</span>
            </div>

            <div class="tagline">
                <span data-i18n="s0">
                    복잡함은 줄이고, 여유는 더하고.
                </span>
            </div>
        </div>

        <button class="nav" id="home">
            <span data-i18n="s1">▦ 내 할 일</span>
        </button>

        <div class="note">
            <strong>
                <span data-i18n="s2">
                    잠시 천천히. 가벼운 하루.
                </span>
            </strong>

            <span data-i18n="s3">
                작은 일 하나를 끝내는 것도 한 걸음 앞으로 나아가는 일이에요.
            </span>

            <div class="progress">
                <div id="side-progress"></div>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <main>

        <!-- Top bar -->
        <div class="top">
            <span id="today"></span>

            <select id="language" aria-label="Language / 언어">
                <option value="ko">한국어</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Hero section -->
        <section class="hero">
            <div>
                <div class="eyebrow">
                    <span data-i18n="s4">나만의 공간</span>
                </div>

                <h1>
                    <span data-i18n="s5">
                        조금 더 가벼운 하루.
                    </span>
                </h1>

                <p>
                    <span data-i18n="s6">
                        할 일을 적고, 중요한 일에 집중하세요.
                    </span>
                </p>
            </div>

            <div class="flower" aria-hidden="true">
                ✳
            </div>
        </section>

        <!-- Statistics -->
        <section class="stats" aria-label="통계" data-i18n-aria-label="s29">

            <div class="stat">
                <small>
                    <span data-i18n="s7">남은 할 일</span>
                </small>

                <b id="pending">0</b>
            </div>

            <div class="stat">
                <small>
                    <span data-i18n="s8">완료한 일</span>
                </small>

                <b id="completed">0</b>
            </div>

            <div class="stat">
                <small>
                    <span data-i18n="s9">진행률</span>
                </small>

                <b id="percent">0%</b>
            </div>

        </section>

        <!-- Workspace -->
        <div class="workspace">

            <!-- Task list -->
            <section class="panel">

                <h2>
                    <span data-i18n="s10">할 일 목록</span>
                </h2>

                <div class="toolbar">

                    <button class="filter active"
                        data-filter="all"
                        aria-pressed="true">
                        <span data-i18n="s11">전체</span>
                    </button>

                    <button class="filter"
                        data-filter="pending"
                        aria-pressed="false">
                        <span data-i18n="s12">진행 중</span>
                    </button>

                    <button class="filter"
                        data-filter="done"
                        aria-pressed="false">
                        <span data-i18n="s13">완료</span>
                    </button>

                </div>

                <input
                    class="search"
                    id="search"
                    type="search"
                    placeholder="할 일 검색…"
                    data-i18n-placeholder="s27"
                    aria-label="할 일 검색"
                    data-i18n-aria-label="s28"
                >

                <div id="tasks"></div>

                <button class="clear" id="clear" hidden>
                    <span data-i18n="s14">
                        완료한 일 삭제
                    </span>
                </button>

            </section>

            <!-- Add task form -->
            <section class="panel">

                <h2>
                    <span data-i18n="s15">새 할 일 추가</span>
                </h2>

                <form id="form">

                    <label for="title">
                        <span data-i18n="s16">
                            무엇을 해야 하나요?
                        </span>
                    </label>

                    <input
                        id="title"
                        placeholder="예: 과제 마무리하기"
                        data-i18n-placeholder="s26"
                        required
                        maxlength="180"
                        autocomplete="off"
                    >

                    <div class="form-grid">

                        <div>
                            <label for="date">
                                <span data-i18n="s17">마감일</span>
                            </label>

                            <input id="date" type="date">
                        </div>

                        <div>
                            <label for="priority">
                                <span data-i18n="s18">우선순위</span>
                            </label>

                            <select id="priority">
                                <option value="normal" data-i18n="s19">
                                    보통
                                </option>

                                <option value="high" data-i18n="s20">
                                    중요
                                </option>
                            </select>
                        </div>

                    </div>

                    <button class="primary" type="submit">
                        <span data-i18n="s21">
                            ＋ 할 일 추가
                        </span>
                    </button>

                </form>

                <p class="sub">
                    <span data-i18n="s22">
                        작은 일 하나부터 시작해 보세요.
                    </span>
                </p>

            </section>

        </div>

        <!-- Footer -->
        <footer class="footer">

            <span>
                <span data-i18n="s23">
                    할 일은 깔끔하게, 하루는 가볍게.
                </span>
            </span>

            <span id="save-status">
                <span data-i18n="s24">
                    이 브라우저에 자동 저장됩니다
                </span>
            </span>

        </footer>

    </main>

    <!-- Notification -->
    <div id="toast" role="status">

        <span id="message"></span>

        <button id="undo" hidden>
            <span data-i18n="s25">실행 취소</span>
        </button>

    </div>

    <script>
        /* JavaScript giữ nguyên ở đây */
    </script>

</body>
</html>
